<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Website Under Maintenance | Azana Hospitality</title>
    <meta
      name="description"
      content="Website Azana Hospitality sedang dalam pemeliharaan. Sementara itu, kunjungi Azana Voyage." />
    <meta name="theme-color" content="#8a0f12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ornamen dekoratif kiri & kanan -->
    <svg
      class="ornament ornament--left"
      viewBox="0 0 160 700"
      aria-hidden="true">
      <line x1="78" y1="0" x2="78" y2="560" class="o-gold" />
      <path
        d="M0 70 C110 140 150 220 150 320 C150 470 70 560 0 590"
        class="o-gold" />
      <path
        d="M0 145 C90 210 137 280 137 400 C137 500 80 600 0 650"
        class="o-red" />
      <path
        d="M0 180 C120 260 150 340 150 420 C150 520 90 610 0 660"
        class="o-gold o-thin" />
      <rect
        x="71"
        y="371"
        width="14"
        height="14"
        transform="rotate(45 78 378)"
        class="o-diamond" />
    </svg>
    <svg
      class="ornament ornament--right"
      viewBox="0 0 160 900"
      aria-hidden="true">
      <line x1="72" y1="250" x2="72" y2="900" class="o-gold" />
      <path
        d="M160 470 C60 520 15 600 15 720 C15 800 40 900 40 900"
        class="o-red" />
      <path
        d="M160 540 C60 580 0 650 0 760 C0 840 70 920 160 970"
        class="o-gold" />
      <rect
        x="65"
        y="721"
        width="14"
        height="14"
        transform="rotate(45 72 728)"
        class="o-diamond" />
    </svg>

    <main class="wrap">
      <!-- Logo -->
      <header class="logo">
        <img
          class="logo__img"
          src="assets/logo-azana.png"
          width="900"
          height="592"
          alt="Azana Hospitality" />
      </header>

      <span class="badge"
        ><span class="badge__dot"></span>System Maintenance</span
      >

      <!-- Ikon -->
      <div class="icon">
        <svg class="icon__ring" viewBox="0 0 300 300" aria-hidden="true">
          <circle cx="150" cy="150" r="144" />
          <circle cx="150" cy="6" r="5" class="dot" />
          <circle cx="150" cy="294" r="5" class="dot" />
        </svg>
        <svg class="icon__tool" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f6dfae" />
              <stop offset="0.45" stop-color="#d9ab6a" />
              <stop offset="1" stop-color="#a87634" />
            </linearGradient>
            <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff3dc" />
              <stop offset="0.5" stop-color="#e0b97c" />
              <stop offset="1" stop-color="#b9843f" />
            </linearGradient>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
              <feDropShadow
                dx="0"
                dy="6"
                stdDeviation="6"
                flood-color="#7a5320"
                flood-opacity="0.25" />
            </filter>
            <filter id="wshadow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow
                dx="-3"
                dy="4"
                stdDeviation="3"
                flood-color="#5e3d12"
                flood-opacity="0.35" />
            </filter>
          </defs>
          <g filter="url(#shadow)">
            <!-- Gear -->
            <g class="gear">
              <path
                fill="url(#gold)"
                fill-rule="evenodd"
                d="
              M92 22 h16 l3 16 a62 62 0 0 1 14 6 l13 -10 l11 11 l-10 13 a62 62 0 0 1 6 14 l16 3 v16 l-16 3 a62 62 0 0 1 -6 14 l10 13 l-11 11 l-13 -10 a62 62 0 0 1 -14 6 l-3 16 h-16 l-3 -16 a62 62 0 0 1 -14 -6 l-13 10 l-11 -11 l10 -13 a62 62 0 0 1 -6 -14 l-16 -3 v-16 l16 -3 a62 62 0 0 1 6 -14 l-10 -13 l11 -11 l13 10 a62 62 0 0 1 14 -6 Z
              M100 66 a34 34 0 1 0 0.01 0 Z"
                transform="translate(100 100) scale(.84) translate(-100 -100)" />
            </g>
            <!-- Wrench -->
            <mask id="slot">
              <rect width="200" height="200" fill="#fff" />
              <rect x="92" y="4" width="16" height="30" rx="3" fill="#000" />
            </mask>
            <g transform="rotate(45 100 100)" filter="url(#wshadow)">
              <g
                mask="url(#slot)"
                stroke="#9c6a2c"
                stroke-opacity=".45"
                stroke-width="1.5">
                <circle cx="100" cy="44" r="30" fill="url(#gold2)" />
                <rect
                  x="89"
                  y="56"
                  width="22"
                  height="122"
                  rx="11"
                  fill="url(#gold2)" />
              </g>
              <path
                d="M95 76 v90"
                stroke="#fff6e0"
                stroke-opacity=".7"
                stroke-width="3"
                stroke-linecap="round"
                fill="none" />
            </g>
          </g>
          <ellipse
            cx="105"
            cy="190"
            rx="55"
            ry="6"
            fill="#7a5320"
            opacity=".12" />
        </svg>
      </div>

      <h1 class="title">Website Under Maintenance</h1>
      <p class="lead">We’re improving your experience and will be back soon.</p>

      <div class="divider" aria-hidden="true">
        <span></span><i></i><span></span>
      </div>

      <p class="note">
        Sementara itu, Anda tetap dapat mengunjungi
        <strong>Azana Voyage</strong>.
      </p>

      <a
        class="btn"
        href="https://book.azanahotel.com"
        target="_blank"
        rel="noopener">
        Go to Azana Voyage
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12h17M14 5l7 7-7 7" />
        </svg>
      </a>

      <footer class="footer">
        © <span id="year">2026</span> Azana Hospitality
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
